name: Deploy Process

on:
  push:
    branches:
      - master
  workflow_dispatch:  # Enable manual triggering
  pull_request:
  schedule:
    - cron: 0 4 * * * # Redeploy at 4 AM every day

# Least privilege by default. Individual jobs widen this only where they need to; nothing here
# writes to the repository, so read access to contents is sufficient throughout.
permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/tests.yml
    secrets:
      LIS_KEY: ${{ secrets.LIS_KEY }}

  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Specify PHP version
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Make branch name available as Bash variable
        run: echo "GITHUB_BRANCH=${GITHUB_REF#refs/heads/}" >> $GITHUB_ENV
      - run: >-
          sudo apt-get update &&
          sudo apt-get install -y awscli php-cli php-curl php-memcached php-mysql yarn zip
      - uses: actions/checkout@v7
      - run: sudo apt-get update -qq
      - run: git clone -b deploy https://github.com/openva/richmondsunlight.com.git
      - name: Cache Composer (richmondsunlight.com)
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-rsincludes-${{ hashFiles('richmondsunlight.com/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-rsincludes-
      - run: cd richmondsunlight.com && composer install --no-interaction --no-progress --prefer-dist && cd ..
      - run: mkdir includes/
      - run: cp richmondsunlight.com/htdocs/includes/*.php includes/
      # For deploy/export_test_data.sh
      - run: cp richmondsunlight.com/deploy/database_export.sh deploy/database_export.sh
      - run: rm -Rf richmondsunlight.com
      - name: Cache Composer (rs-machine)
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-machine-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-machine-
      - run: composer install --no-interaction --no-progress --prefer-dist
      # Lint every PHP file this repository owns. `includes/` is excluded because it is
      # populated from the richmondsunlight.com repo and is not ours to gate on. The previous
      # pattern (`find cron/*.php`) was non-recursive, so it silently skipped cron/tasks/ and
      # src/ -- a syntax error in the task runner would have deployed clean.
      - name: Lint PHP
        run: |
          find . -path ./includes -prune -o -path ./richmondsunlight.com -prune \
               -o -name '*.php' -type f -print0 \
            | xargs -0 -n1 -P8 php -l
      # These tests run against settings-default.inc.php, which has empty placeholder values.
      # They parse CSV fixtures and do not touch the network or the database, so they do not
      # need real credentials.
      - name: Run build-time tests
        run: |
          cp includes/settings-default.inc.php includes/settings.inc.php
          cd deploy/tests/ && php bills.php && php committee_members.php
      # The artifact deliberately contains NO credentials. settings.inc.php is populated in the
      # deploy job instead, immediately before the bundle is pushed to CodeDeploy. Previously
      # this step ran after config_variables.sh and uploaded `path: .`, so every artifact was a
      # ~32MB bundle containing production database passwords and AWS keys, downloadable by
      # anyone with repository read access for the full 90-day retention window.
      - name: Save built code for the deploy step
        uses: actions/upload-artifact@v7
        with:
          name: codebase
          path: .
          retention-days: 1

  deploy:
    runs-on: ubuntu-22.04
    needs: [build, test] # Don't deploy unless both build and tests succeed
    # Only deploy from master. Without this, a pull_request event would attempt a production
    # deploy, and secrets would be requested for a build of untrusted code.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
    steps:
      - name: Get the built code
        uses: actions/download-artifact@v8
        with:
          name: codebase
      # Secrets are scoped to this single step rather than dumped into the job environment via
      # toJSON(secrets). Only the 21 variables config_variables.sh actually substitutes are
      # exposed, and only for as long as this step runs -- so composer, apt and the test scripts
      # in the build job never see them. This is what CodeQL's actions/excessive-secrets-exposure
      # rule was flagging.
      - name: Populate credentials
        env:
          LIS_FTP_USERNAME: ${{ secrets.LIS_FTP_USERNAME }}
          LIS_FTP_PASSWORD: ${{ secrets.LIS_FTP_PASSWORD }}
          PDO_DSN: ${{ secrets.PDO_DSN }}
          PDO_SERVER: ${{ secrets.PDO_SERVER }}
          PDO_USERNAME: ${{ secrets.PDO_USERNAME }}
          PDO_PASSWORD: ${{ secrets.PDO_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          GMAPS_KEY: ${{ secrets.GMAPS_KEY }}
          OPENSTATES_KEY: ${{ secrets.OPENSTATES_KEY }}
          OPENVA_KEY: ${{ secrets.OPENVA_KEY }}
          VA_DECODED_KEY: ${{ secrets.VA_DECODED_KEY }}
          LIS_KEY: ${{ secrets.LIS_KEY }}
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
          MEMCACHED_SERVER: ${{ secrets.MEMCACHED_SERVER }}
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          AWS_SECRET_KEY: ${{ secrets.AWS_SECRET_KEY }}
          AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY }}
          API_URL: ${{ secrets.API_URL }}
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
        run: |
          chmod +x deploy/config_variables.sh deploy/aws_credentials.sh deploy/sftp_credentials.sh
          ./deploy/config_variables.sh
          ./deploy/aws_credentials.sh
          ./deploy/sftp_credentials.sh
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: us-east-1
      - name: Deploy via CodeDeploy
        run: |
          aws deploy push --application-name RS-Machine \
            --s3-location s3://deploy.richmondsunlight.com/rs-machine-master.zip \
            --ignore-hidden-files
          aws deploy create-deployment \
            --application-name RS-Machine \
            --deployment-group-name RS-Machine-Fleet \
            --deployment-config-name CodeDeployDefault.OneAtATime \
            --s3-location bucket=deploy.richmondsunlight.com,key=rs-machine-master.zip,bundleType=zip
